AutoName: FreeNet
Summary: DPI bypass VPN — обход блокировок без root
Description: |-
  FreeNet — кросс-платформенный инструмент обхода DPI (глубокая инспекция пакетов)
  для Российских провайдеров (РКН/ТСПУ). Работает без root через VpnService API.

  Стратегии обхода:
  * TCP split — фрагментация TLS ClientHello на позиции SNI
  * TLS record splitting — разбивка на два TLS record
  * Fake packets — пакеты-приманки с TTL=4
  * Combined — комбинированная атака
  * Auto — авто-выбор лучшей стратегии под провайдера

  Дополнительные возможности:
  * DNS-over-HTTPS (Cloudflare / Google / Quad9) — защита от подмены DNS
  * ECH (Encrypted Client Hello) — passthrough зашифрованных соединений
  * Per-app split tunnel — выбор приложений, которые идут через VPN
  * UDP relay — Discord, Steam, видеозвонки
  * Виджет 2×1 на рабочем столе
  * Автозапуск при загрузке устройства
  * Telegram бот — управление сервером удалённо (/status /on /off /strategy /stats)

  Сборка без gomobile AAR автоматически использует чистый Kotlin fallback
  (PacketForwarder), который обеспечивает базовое TCP-проксирование.

RepoType: git
Repo: https://github.com/mintfary-oss/zapret2-may

Builds:
  - versionName: 1.6.0
    versionCode: 160
    commit: freenet-v1.6.0
    subdir: go-freenet/android
    gradle:
      - yes
    # F-Droid builds without the gomobile AAR.
    # FreenetVpnService detects the missing AAR at runtime and automatically
    # falls back to the pure-Kotlin PacketForwarder (basic TCP forwarding).
    # No prebuild script needed — the AAR dependency is declared as optional
    # in app/build.gradle.kts: if (file("libs/mobile.aar").exists()) { ... }

  - versionName: 1.7.0
    versionCode: 170
    commit: freenet-v1.7.0
    subdir: go-freenet/android
    gradle:
      - yes
    # Phase 8: F-Droid manifest, OpenWrt init.d, Android instrumented tests,
    # Go benchmarks, MIPS/MIPSle CI builds.

  - versionName: 1.8.0
    versionCode: 180
    commit: freenet-v1.8.0
    subdir: go-freenet/android
    gradle:
      - yes
    # Phase 9: Android release APK signing, Telegram bot for remote control,
    # test coverage 60%+, docs updated.

  - versionName: 1.8.2
    versionCode: 182
    commit: freenet-v1.8.2
    subdir: go-freenet/android
    gradle:
      - yes
    # fix(android): correct Java package names in gomobile reflection.
    # gomobile bind uses -javapkg com.freenet.bypass, so generated classes are
    # com.freenet.bypass.Mobile / FreenetEngine / SocketProtector — not mobile.*.
    # Previous reflection code always threw ClassNotFoundException → engine never
    # started → VPN connected but all traffic dropped. Now Go engine runs correctly.

