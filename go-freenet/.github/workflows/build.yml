name: Build FreeNet

on:
  push:
    branches: ["master", "main", "neo/**"]
    paths: ["go-freenet/**"]
  pull_request:
    paths: ["go-freenet/**"]
  release:
    types: [created]

defaults:
  run:
    working-directory: go-freenet

jobs:
  # ---- lint & vet ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-freenet/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need formatting:"
            echo "$out"
            exit 1
          fi

  # ---- cross-compile ----
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: freenet-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: freenet-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: freenet-linux-armv7
          - goos: windows
            goarch: amd64
            artifact: freenet-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-freenet/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" \
            -o dist/${{ matrix.artifact }} \
            ./cmd/freenet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: go-freenet/dist/${{ matrix.artifact }}
          retention-days: 30

  # ---- release: attach binaries ----
  release:
    name: Attach release binaries
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
