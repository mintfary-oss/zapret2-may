name: Build FreeNet

on:
  push:
    branches: ["master", "main", "neo/**"]
    paths: ["go-freenet/**"]
  pull_request:
    paths: ["go-freenet/**"]
  release:
    types: [created]

defaults:
  run:
    working-directory: go-freenet

jobs:
  # ---- lint & vet ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-freenet/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files need formatting:"
            echo "$out"
            exit 1
          fi

  # ---- cross-compile ----
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: freenet-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: freenet-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: freenet-linux-armv7
          - goos: windows
            goarch: amd64
            artifact: freenet-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-freenet/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" \
            -o dist/${{ matrix.artifact }} \
            ./cmd/freenet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: go-freenet/dist/${{ matrix.artifact }}
          retention-days: 30

  # ---- Android AAR (gomobile) ----
  android-aar:
    name: Android AAR (gomobile)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go-freenet/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Android AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          gomobile bind \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 26 \
            -javapkg com.freenet.bypass \
            -o dist/mobile.aar \
            ./internal/mobile

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          mkdir -p android/app/libs
          cp dist/mobile.aar android/app/libs/mobile.aar
          cd android
          chmod +x ./gradlew || true
          # Download gradlew wrapper if not present.
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 2>/dev/null || true
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-aar
          path: go-freenet/dist/mobile.aar
          retention-days: 30

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freenet-debug.apk
          path: go-freenet/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ---- release: attach binaries ----
  release:
    name: Attach release binaries
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
