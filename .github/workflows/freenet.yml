name: Build & Release FreeNet

# push branches (paths-filtered) → build + test
# push v* tag                    → build + create GitHub Release
# pull_request (paths-filtered)  → build + test
# workflow_dispatch               → manual trigger from Actions UI
on:
  push:
    branches: ["master", "main", "neo/**"]
    tags:     ["freenet-v*.*.*"]
    paths:    ["go-freenet/**"]
  pull_request:
    paths: ["go-freenet/**"]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: go-freenet

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── lint & vet ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go-freenet/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Files need formatting:"; echo "$out"; exit 1; fi

  # ── Linux & Windows binaries ───────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64,  artifact: freenet-linux-amd64}
          - {goos: linux,   goarch: arm64,  artifact: freenet-linux-arm64}
          - {goos: linux,   goarch: arm,    goarm: "7", artifact: freenet-linux-armv7}
          # OpenWrt routers — MIPS big-endian (TP-Link WR841, Netgear WNR, etc.)
          - {goos: linux,   goarch: mips,   gomips: softfloat, artifact: freenet-linux-mips}
          # OpenWrt routers — MIPS little-endian (MediaTek MT7620/MT7621, Qualcomm Atheros)
          - {goos: linux,   goarch: mipsle, gomips: softfloat, artifact: freenet-linux-mipsle}
          - {goos: windows, goarch: amd64,  artifact: freenet-windows-amd64.exe}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go-freenet/go.sum
      - name: Build
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          GOMIPS:      ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/${{ matrix.artifact }} ./cmd/freenet
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: go-freenet/dist/${{ matrix.artifact }}
          retention-days: 30

  # ── Android APK (gomobile + Gradle) ────────────────────────────────────────
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go-freenet/go.sum
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Android AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          mkdir -p dist
          gomobile bind \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 26 \
            -javapkg com.freenet.bypass \
            -o dist/mobile.aar \
            ./mobile

      - name: Build Android APK (debug + release)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          # Release signing secrets — set in repo Settings → Secrets.
          # When absent the release build is produced unsigned (fine for
          # F-Droid; F-Droid re-signs with its own key).
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app/libs
          cp dist/mobile.aar android/app/libs/mobile.aar
          cd android
          chmod +x ./gradlew
          # Build debug APK (always).
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/freenet-android-debug.apk
          # Build release APK (signed when secrets present, unsigned otherwise).
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk ../dist/freenet-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-aar
          path: go-freenet/dist/mobile.aar
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: freenet-android.apk
          path: go-freenet/dist/freenet-android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: freenet-android-debug.apk
          path: go-freenet/dist/freenet-android-debug.apk
          retention-days: 30

  # ── Linux installer bundle ─────────────────────────────────────────────────
  package-linux:
    name: Package Linux installer
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: freenet-linux-amd64
          path: go-freenet/dist/
      - name: Create Linux installer bundle
        run: |
          mkdir -p bundle/freenet
          cp dist/freenet-linux-amd64      bundle/freenet/freenet
          cp scripts/install.sh             bundle/freenet/install.sh
          cp init.d/systemd/freenet.service bundle/freenet/freenet.service
          chmod +x bundle/freenet/freenet bundle/freenet/install.sh
          tar -C bundle -czf dist/freenet-linux-amd64-installer.tar.gz freenet/
          echo "Bundle contents:"; tar -tzf dist/freenet-linux-amd64-installer.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: freenet-linux-amd64-installer
          path: go-freenet/dist/freenet-linux-amd64-installer.tar.gz
          retention-days: 30

  # ── Windows bundle with WinDivert ──────────────────────────────────────────
  # Bundles freenet.exe + WinDivert DLL/SYS into a ready-to-run ZIP.
  # WinDivert 2.4 enables kernel-level transparent interception of all
  # applications — no SOCKS5 configuration needed on the client side.
  package-windows:
    name: Package Windows bundle (+ WinDivert)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: freenet-windows-amd64.exe
          path: go-freenet/dist/

      - name: Download WinDivert (latest release)
        run: |
          # Resolve the latest release asset URL via GitHub API (no auth needed for public repo).
          WD_URL=$(curl -fsSL https://api.github.com/repos/basil00/WinDivert/releases/latest \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next(a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.zip')))")
          echo "Downloading WinDivert from: $WD_URL"
          curl -fsSL -o /tmp/windivert.zip "$WD_URL"
          unzip -q /tmp/windivert.zip -d /tmp/windivert/
          echo "WinDivert extracted:"
          find /tmp/windivert -name "*.dll" -o -name "*.sys" | head -20

      - name: Create Windows bundle ZIP
        run: |
          mkdir -p bundle
          # Executable
          cp dist/freenet-windows-amd64.exe bundle/freenet.exe
          # WinDivert x64 kernel driver files — locate dynamically (dir name includes version).
          WD_DLL=$(find /tmp/windivert -path "*/x64/WinDivert.dll" | head -1)
          WD_SYS=$(find /tmp/windivert -path "*/x64/WinDivert64.sys" | head -1)
          if [ -z "$WD_DLL" ] || [ -z "$WD_SYS" ]; then
            echo "ERROR: WinDivert x64 files not found in /tmp/windivert"
            find /tmp/windivert -type f | head -20
            exit 1
          fi
          cp "$WD_DLL" bundle/WinDivert.dll
          cp "$WD_SYS" bundle/WinDivert64.sys
          # Quick-start README
          cat > bundle/README.txt <<'EOF'
          FreeNet — обход блокировок для Windows
          =======================================

          Установка (рекомендуется):
            Запустить от Администратора:  freenet.exe -install
            → FreeNet устанавливается как служба и запускается автоматически.
            → Появляется иконка в системном трее.
            → WinDivert перехватывает ВЕСЬ трафик — все приложения работают.

          Запуск вручную (без установки):
            freenet.exe
            → Открыть http://localhost:8080 для управления.

          Удаление:
            freenet.exe -uninstall

          Файлы:
            freenet.exe        — основная программа
            WinDivert.dll      — драйвер перехвата трафика (обязателен)
            WinDivert64.sys    — системный драйвер WinDivert (обязателен)

          Все три файла должны находиться в одной папке.
          EOF
          cd bundle && zip -r ../dist/freenet-windows-bundle.zip .
          echo "Bundle contents:"; unzip -l ../dist/freenet-windows-bundle.zip

      - uses: actions/upload-artifact@v4
        with:
          name: freenet-windows-bundle
          path: go-freenet/dist/freenet-windows-bundle.zip
          retention-days: 30

  # ── GitHub Release (runs only on v* tag push) ──────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, android, package-linux, package-windows]
    if: startsWith(github.ref, 'refs/tags/freenet-v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Artifacts download into go-freenet/dist/ (matches default working-dir).
      - uses: actions/download-artifact@v4
        with:
          path: go-freenet/dist/
          merge-multiple: true

      # Install scripts are copied relative to the go-freenet/ working-dir.
      - name: Add install scripts to release
        run: |
          cp scripts/install.sh          dist/install.sh
          cp scripts/install-windows.ps1 dist/install-windows.ps1
          chmod +x dist/install.sh

      - name: List release artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: "FreeNet ${{ github.ref_name }}"
          body: |
            ## FreeNet ${{ github.ref_name }} — Обход DPI / DPI bypass

            ### ⚡ Установка одной командой

            **🤖 Android** — скачай APK и установи (включи «Установка из неизвестных источников»):
            👉 **[freenet-android.apk](https://github.com/${{ github.repository }}/releases/latest/download/freenet-android.apk)**

            **🪟 Windows** — скачать ZIP (WinDivert уже внутри):
            👉 **[freenet-windows-bundle.zip](https://github.com/${{ github.repository }}/releases/latest/download/freenet-windows-bundle.zip)**
            Распакуй → запусти от Администратора: `freenet.exe -install`
            WinDivert автоматически перехватит трафик ВСЕХ приложений.

            Или PowerShell one-liner от Администратора:
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 | iex
            ```

            **🐧 Linux** — одна команда:
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
            ```

            **🐳 Docker:**
            ```bash
            git clone https://github.com/${{ github.repository }} && cd zapret2-may/go-freenet && docker compose up -d
            ```

            ---

            | Платформа | Файл | Инструкция |
            |-----------|------|------------|
            | 🤖 Android | `freenet-android.apk` | Скачать → установить APK |
            | 🪟 Windows (рекомендуется) | `freenet-windows-bundle.zip` | Распаковать → `freenet.exe -install` (от Администратора) |
            | 🪟 Windows (авто) | `install-windows.ps1` | PowerShell one-liner |
            | 🪟 Windows (exe без WinDivert) | `freenet-windows-amd64.exe` | Только SOCKS5 режим |
            | 🐧 Linux bundle | `freenet-linux-amd64-installer.tar.gz` | Распаковать → `sudo bash install.sh` |
            | 🐧 Linux one-liner | `install.sh` | `curl … | sudo bash` |
            | 🐧 Linux amd64 | `freenet-linux-amd64` | Bare binary |
            | 🐧 Linux arm64 | `freenet-linux-arm64` | Bare binary |
            | 🐧 Linux ARMv7 | `freenet-linux-armv7` | Bare binary (Raspberry Pi) |
            | 📡 OpenWrt MIPS | `freenet-linux-mips` | TP-Link WR841, Netgear WNR |
            | 📡 OpenWrt MIPSle | `freenet-linux-mipsle` | MediaTek MT7620/MT7621 |
            | 🐳 Android AAR | `mobile.aar` | Для разработчиков |

          generate_release_notes: true
          files: go-freenet/dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
